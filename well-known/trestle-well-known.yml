source: >-
  Live probes of the /.well-known/ discovery surface on every host in apis.yml
  (baseURL + Website + Documentation + SignUp/Login) during the 2026-07-26
  enrichment round. The host-root /.well-known/ surface is empty across all four
  hosts, but Trestle's IdentityServer mounts a REAL, anonymously readable OpenID
  Connect discovery document under the /trestle/oidc/ path prefix — the previous
  round probed only the host root and recorded a 404. That document is the
  machine-readable half of the authentication contract and is saved verbatim.
description: >-
  Trestle publishes no security.txt, no api-catalog, and no ai-plugin.json.
  It does publish OIDC discovery (RFC 8414-shaped) and a JWKS at a path-prefixed
  location under the API host, which enumerates the real scopes (api, rets,
  offline_access), grant types and endpoints.
