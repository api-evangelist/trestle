generated: '2026-07-26'
method: searched
source: >-
  Trestle's own anonymously readable resource metadata browser —
  https://api.cotality.com/trestle/Documentation/MetaData/Resource/<Resource>
  for all 15 RESO resources — cross-checked against the OData service document
  at openapi/trestle-odata-service-document.json. Field counts, primary keys,
  InKeyIndex batching fields and every navigation property (Expands) below were
  read from those pages, not inferred.
docs: https://trestle-documentation.corelogic.com/metadata-reso.html
description: >-
  The RESO Data Dictionary 2.0 entity graph as Trestle republishes it. This is
  the closest thing to a machine-readable contract that Trestle exposes
  anonymously: the OData $metadata CSDL is behind a Bearer token, but the same
  information — resources, primary keys, field counts, and the navigation
  properties you can $expand — is published as HTML on the metadata browser.
  Property is the hub; everything else hangs off it.
notation: >-
  relationships use has_one / has_many / belongs_to with the OData navigation
  property name in `via`; direction is from the entity that exposes the expand.

surfaces:
  odata: https://api.cotality.com/trestle/odata
  rets: https://api.cotality.com/trestle/rets/search?SearchType=<Resource>&Class=<Resource>
  metadata_browser: https://api.cotality.com/trestle/Documentation/MetaData/Resource/
  enumerations: https://api.cotality.com/trestle/Documentation/MetaData/Enums
  csdl_metadata: https://api.cotality.com/trestle/odata/$metadata
  csdl_metadata_status: 401

