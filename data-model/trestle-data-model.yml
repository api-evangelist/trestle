in_key_index:
  description: >-
    Per-resource field lists that may be queried in batches of up to 300,000
    records (versus the normal $top ceiling of 1,000) when used with $select.
    This is the mechanism behind the documented reconciliation strategy.
  resources:
    Property: [ListingId, ListingKey, ModificationTimestamp, PhotosChangeTimestamp, PhotosCount, PostalCode, StandardStatus]
    Media: [MediaKey, MediaModificationTimestamp, ModificationTimestamp, OriginatingSystemID, ResourceRecordID, ResourceRecordKey, SourceSystemID]
    Member: [MemberKey, MemberMlsId, ModificationTimestamp]
    Office: [ModificationTimestamp, OfficeKey, OfficeMlsId]
    Teams: [ModificationTimestamp, TeamKey, TeamLeadKey, TeamLeadMlsId]
    TeamMembers: [MemberKey, MemberMlsId, ModificationTimestamp, TeamKey, TeamMemberKey]
    OpenHouse: [ListingId, ListingKey, ModificationTimestamp, OpenHouseId, OpenHouseKey]
    PropertyRooms: [ListingId, ListingKey, ModificationTimestamp, RoomKey]
    PropertyUnitTypes: [ListingId, ListingKey, ModificationTimestamp, UnitTypeKey]
    CustomProperty: [ListingId, ListingKey]
    Building: [BuildingId, BuildingKey, ComplexId, ModificationTimestamp, PhotosChangeTimestamp, PhotosCount, PostalCode, UniversalPropertyId]
    HistoryTransactional: [ChangedByMemberID, ChangedByMemberKey, FieldKey, HistoryTransactionalKey, ListAgentKey, ListOfficeKey, ModificationTimestamp, OriginatingSystemHistoryKey, ResourceRecordID, ResourceRecordKey, SourceSystemHistoryKey, SourceSystemID]
    Field: [FieldKey, ModelKey, ModificationTimestamp]
