notes:
  cadence: >-
    Content patches land roughly monthly to every six weeks; the numbered
    product releases (Trestle 5.x) stopped being published after 5.20 in 2021 —
    since then the public log is content patches only.
  breaking_change_signal: >-
    Removed fields and removed lookup values are called out per patch, which is
    the only breaking-change signal Trestle publishes. There is no
    Deprecation/Sunset header and no per-field deprecation window.
