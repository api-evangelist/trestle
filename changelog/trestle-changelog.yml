description: >-
  Trestle publishes a dated change log on the documentation index, split into
  "Recent Changes" and "Previous Changes". Two kinds of entry interleave:
  numbered Content Patches (data-dictionary changes — fields, lookup values,
  resources) and numbered product releases (Trestle 5.x, platform behaviour).
  Every entry links a PDF; the date in the PDF filename is the entry date.
  A companion "Field & Lookup Change Document" is maintained as a Google Sheet.
  This artifact captures the recent window (Content Patch #180 → #192 plus the
  most recent product release); the live index is the source of truth.

versioning:
  scheme: numbered content patches (data dictionary) + numbered product releases
  current_content_patch: '#192'
  current_product_release: '5.20'
  detail: lifecycle/trestle-lifecycle.yml

field_change_document:
