  - type: Enumerations
    url: https://api.cotality.com/trestle/Documentation/MetaData/Enums
- aid: trestle:trestle-direct-web-api
  name: Trestle Direct Web API
  description: >-
    A bidirectional OData interface into the Matrix MLS database, separate from the RESO
    feed. The CRM reference documents Contacts, EmailHistory, Lists, PortalContents,
    SavedSearches, UserRegistry and an aggregated DashboardAPI with read and write
    operations; a companion MLO reference covers multiple-listing-organization
    integration. Authentication is OpenID Connect, with Clareity Single Sign-On
    authorization and HTTP Basic named as alternatives, and access is further constrained
    by the acting user's privileges in Matrix. No explicit base URL is published in the
    reference, so none is asserted here.
  humanURL: https://trestle-documentation.corelogic.com/direct-webapi-crm-reference.html
  tags:
  - Matrix MLS
  - CRM
  - OData
  - Real Estate
  properties:
  - type: APIReference
    url: https://trestle-documentation.corelogic.com/direct-webapi-crm-reference.html
  - type: APIReference
    url: https://trestle-documentation.corelogic.com/direct-webapi-mlo-reference.html
- aid: trestle:trestle-participant-reporting-api
  name: Trestle Participant Reporting API
  description: >-
    A compliance API that lets technology providers report to each MLS which brokers they
    hold contracts with — the mechanism by which the licence relationship behind a data
    feed is evidenced. Documented operations are POST and GET on
    /trestle/report/TpParticipantReport, authenticated with the same OAuth2
    client_credentials flow as the Web API (scope=api for Web API feeds, scope=rets for
    RETS feeds). Not every MLS uses it; some require individual contracts hosted in
    Trestle instead.
  humanURL: https://trestle-documentation.corelogic.com/participant-reporting-api.html
  baseURL: https://api.cotality.com/trestle/report
  tags:
  - Compliance
  - Reporting
  - MLS
  - Real Estate
  properties:
  - type: APIReference
    url: https://trestle-documentation.corelogic.com/participant-reporting-api.html
- aid: trestle:trestle-rets
  name: Trestle RETS
  description: >-
    Trestle's legacy Real Estate Transaction Standard interface, documented as compliant
    with RETS 1.8. RESO no longer updates the RETS specification, but Trestle continues to
    serve it for customers who cannot move to the Web API. Login is POST
    /trestle/rets/login; the service is session-less and supports either HTTP Basic with a
    Base64-encoded client_id:client_secret or an OAuth2 bearer token obtained with
    scope=rets. Digest authentication is explicitly not supported.
  humanURL: https://trestle-documentation.corelogic.com/rets.html
  baseURL: https://api.cotality.com/trestle/rets
  tags:
  - RETS
  - Legacy
  - MLS
  - Real Estate
  properties:
  - type: Documentation
    url: https://trestle-documentation.corelogic.com/rets.html
  - type: Documentation
    url: https://trestle-documentation.corelogic.com/rets-libraries.html
  - type: Documentation
    url: https://trestle-documentation.corelogic.com/rets-connector.html
