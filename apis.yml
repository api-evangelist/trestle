aid: trestle
url: https://raw.githubusercontent.com/api-evangelist/trestle/refs/heads/main/apis.yml
name: Trestle
kind: company
description: >-
  Trestle is the real estate data distribution platform operated by CoreLogic (rebranded
  Cotality in 2025), sitting between roughly 500 US Multiple Listing Services and the
  technology providers, brokers and aggregators that consume their listing data. Its
  home market is the United States. Trestle occupies the licensing-and-transport layer
  of the residential real estate value chain: it maps each participating MLS into the
  RESO Data Dictionary and republishes it through a RESO Web API 2.0 / OData 4.0
  endpoint and a legacy RETS 1.8 endpoint, plus a bidirectional Direct Web API into the
  Matrix MLS CRM and a Participant Reporting API used to prove broker relationships back
  to the MLSs. Its API posture is unusually honest for this sector: the documentation
  portal at trestle-documentation.corelogic.com is fully public and needs no login, the
  OAuth2 client-credentials flow and every OData query convention are published openly,
  and the OData service document at api.cotality.com/trestle/odata answers anonymously
  with a 200. But nothing behind it is reachable. The $metadata document and every
  entity set return 401 Bearer, and credentials are only issued after a developer
  registers a Technology Provider or Broker account, requests a connection to a specific
  multiple listing organization, and completes an e-signed data licence contract that all
  parties sign — a contract most MLSs will only ratify if a licensed broker or agent
  sponsors it or the technology provider files periodic participant reports. Trestle is
  RESO-certified and publicly documented, and still effectively uncallable without a
  signed licence. Certification is not reachability.
