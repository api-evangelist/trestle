sources:
  - url: https://www.cotality.com/products/trestle
    type: Website
    note: Product overview; four modules and target audience.
  - url: https://trestle-documentation.corelogic.com/
    type: Documentation
    note: Public documentation index; host migration notice to api.cotality.com.
  - url: https://trestle-documentation.corelogic.com/webapi.html
    type: Documentation
    note: OAuth2 client_credentials flow, scope=api, base URL, quotas, replication.
  - url: https://trestle-documentation.corelogic.com/webapi-reference.html
    type: APIReference
    note: OData query conventions and links to resource metadata and enumerations.
  - url: https://trestle-documentation.corelogic.com/faq.html
    type: Documentation
    note: The access gate, verbatim — account types, e-signing contract, broker ratification, participant reporting.
  - url: https://trestle-documentation.corelogic.com/direct-webapi-crm-reference.html
    type: APIReference
    note: Direct Web API CRM resources and OIDC/Clareity/Basic auth.
  - url: https://trestle-documentation.corelogic.com/participant-reporting-api.html
    type: APIReference
    note: TpParticipantReport endpoints and shared OAuth2 auth.
  - url: https://trestle-documentation.corelogic.com/rets.html
    type: Documentation
    note: RETS 1.8 compliance, login endpoint, auth options.
  - url: https://www.cotality.com/resources/article/corelogic-achieves-reso-data-dictionary-v2-0-vendor-certification
    type: Certification
    note: RESO Data Dictionary v2.0 vendor certification, 2024-10-11; UPI v2.0 first.
  - url: https://www.reso.org/blog/corelogic-trestle-achieves-reso-platinum-certification-2/
    type: Certification
    note: RESO Platinum certification for the Trestle Web API.

notes:
  duplicateRisk: >-
    An existing api-evangelist repo at all/corelogic already profiles CoreLogic/Cotality
    and carries 22 AE-DERIVED OpenAPI documents generated from these same Trestle
    documentation pages. This trestle repo is the product-level, tier-scoped profile and
    deliberately harvests only what was fetched verbatim. Dedupe or explicitly split
    company (corelogic) from product (trestle) before publishing both.
  provenance: >-
    Nothing in this repo is provider-published as an OpenAPI. The single saved artifact is
    a verbatim OData service document fetched anonymously. No specs were copied from
    all/corelogic, because those are AE-derived and would misrepresent Trestle as
    publishing machine-readable contracts it does not publish.
